name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install distribution dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-secret-1 tesseract-ocr tesseract-ocr-eng tesseract-ocr-por \
            tesseract-ocr-osd libglib2.0-bin xvfb desktop-file-utils

      - name: Resolve the version being released
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish if the tag and the source disagree
        run: |
          SOURCE="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/translate_linux/__init__.py)"
          EXPECTED="${{ steps.version.outputs.version }}"
          if [ "$SOURCE" != "$EXPECTED" ]; then
            echo "::error::tag says $EXPECTED but __version__ says $SOURCE"
            exit 1
          fi
          echo "version $SOURCE matches the tag"

      - name: Create the virtualenv
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      # A tag never publishes without a green suite.
      - name: Lint
        run: .venv/bin/ruff check --output-format=github .

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Type-check
        run: .venv/bin/mypy

      - name: Test
        run: |
          make schema
          xvfb-run -a .venv/bin/pytest

      - name: Validate the desktop entry
        run: desktop-file-validate data/translate-linux.desktop

      - name: Build the package
        id: package
        run: echo "path=$(./packaging/build-deb.sh)" >> "$GITHUB_OUTPUT"

      # Installing into a clean container is the only check that proves the
      # declared dependencies are actually satisfiable.
      - name: Install into a clean container
        run: |
          docker run --rm -v "$PWD/dist:/dist" ubuntu:24.04 bash -eux -c '
            apt-get update
            apt-get install -y --no-install-recommends /dist/*.deb
            translate-linux --version
            test -f /usr/share/glib-2.0/schemas/io.github.reginaldomorais.TranslateLinux.gschema.xml
            translate-linux --doctor || true
          '

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.deb > SHA256SUMS

      - name: Build the release notes
        run: |
          PREVIOUS="$(git describe --tags --abbrev=0 "${{ steps.version.outputs.tag }}^" 2>/dev/null || true)"
          {
            echo "## Instalação"
            echo
            echo '```bash'
            echo "sudo apt install ./translate-linux_${{ steps.version.outputs.version }}_all.deb"
            echo "translate-linux --install-engine"
            echo "translate-linux --install-model en-pt"
            echo "translate-linux --doctor"
            echo '```'
            echo
            echo "## Mudanças"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --pretty='- %s' "$PREVIOUS..${{ steps.version.outputs.tag }}"
            else
              git log --no-merges --pretty='- %s' "${{ steps.version.outputs.tag }}"
            fi
          } > release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          # Anything below 1.0 is a pre-release, and says so.
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          files: |
            dist/*.deb
            dist/SHA256SUMS
