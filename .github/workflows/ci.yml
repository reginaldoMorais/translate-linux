name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and tests
    # Zorin OS 18 is based on Ubuntu 24.04; the runner must match it so that
    # GTK, libadwaita and Tesseract versions mirror the target environment.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install distribution dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-ayatanaappindicator3-0.1 gir1.2-secret-1 \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-por tesseract-ocr-osd \
            libglib2.0-bin xvfb desktop-file-utils

      - name: Create the virtualenv with system site packages
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Report the resolved environment
        run: |
          .venv/bin/python --version
          .venv/bin/python -c "import gi; gi.require_version('Gtk','4.0'); \
            from gi.repository import Gtk; \
            print(f'GTK {Gtk.get_major_version()}.{Gtk.get_minor_version()}')"
          tesseract --version | head -1

      - name: Lint
        run: .venv/bin/ruff check --output-format=github .

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Type-check
        run: .venv/bin/mypy

      # -v so that a crash names the test it died on. A process that aborts
      # never prints pytest's summary, and progress dots identify nothing.
      - name: Test
        run: |
          make schema
          xvfb-run -a dbus-run-session -- .venv/bin/pytest -v \
            --cov=translate_linux --cov-report=term-missing
